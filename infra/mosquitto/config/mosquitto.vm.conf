# TankVitals — Mosquitto da VM Oracle (INFRA-03)
# Copiar para a VM como mosquitto.conf. Difere do local em uma coisa só: aqui a
# porta 1883 fica aberta para a internet, então acesso anônimo está proibido.

listener 1883

allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Criar o arquivo de senhas antes de subir (o passwd está no .gitignore):
#   docker run --rm -it -v "$PWD/config:/mosquitto/config" eclipse-mosquitto:2 \
#     mosquitto_passwd -c /mosquitto/config/passwd tankvitals
#
# As mesmas credenciais vão em MQTT_USERNAME/MQTT_PASSWORD (.env do backend) e
# MQTT_USER/MQTT_PASS (sketch.ino).
