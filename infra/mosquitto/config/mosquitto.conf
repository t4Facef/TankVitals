# TankVitals — configuração do Mosquitto local
# Tarefas: INFRA-01 (broker local), INFRA-04 (bridge com o broker público)

# ---------------------------------------------------------------------------
# Listener (INFRA-01)
# ---------------------------------------------------------------------------
# O Mosquitto 2.x NÃO aceita conexão vinda de fora do container sem declarar
# listener e uma política de autenticação. Esquecer isso dá "Connection
# refused" em qualquer cliente, e o sintoma não diz o motivo.
listener 1883

# O broker não fica exposto na internet: quem publica de fora é o ESP32, e ele
# chega aqui pela bridge, não por conexão direta.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ---------------------------------------------------------------------------
# Listener WebSocket (reserva para o 2º bimestre)
# ---------------------------------------------------------------------------
# listener 9001
# protocol websockets

# ---------------------------------------------------------------------------
# Bridge com o broker público (INFRA-04)
# ---------------------------------------------------------------------------
# O ESP32 do Wokwi roda na nuvem e não enxerga o localhost de ninguém. Ele
# publica no test.mosquitto.org (que também é Mosquitto) e a bridge importa as
# mensagens para cá — o backend continua falando só com o broker local.
#
# O prefixo precisa ser ÚNICO do grupo: o broker público é aberto, e com
# "tankvitals" genérico qualquer um publica lixo no tópico no meio da
# apresentação. O mesmo valor vai em MQTT_TOPIC_PREFIX (.env) e TOPIC_PREFIX
# (sketch.ino).
#
# "in" = só importa mensagens, não reexporta as nossas para o mundo.
# "try_private false" é obrigatório porque o broker público não é nosso — sem
# ele a bridge entra em laço de reconexão.

connection wokwi-bridge
address test.mosquitto.org:1883
topic tankvitals-unifacef-g3/# in 0
bridge_protocol_version mqttv311
cleansession true
try_private false
notifications false
