# TankVitals — configuração do Mosquitto
# Tarefas: INFRA-01 (broker local), INFRA-03 (broker na VM), INFRA-04 (plano B)

# ---------------------------------------------------------------------------
# Listener (INFRA-01)
# ---------------------------------------------------------------------------
# O Mosquitto 2.x NÃO aceita conexão vinda de fora do container sem declarar
# listener e uma política de autenticação. Esquecer isso dá "Connection
# refused" em qualquer cliente, e o sintoma não diz o motivo.
listener 1883

# Vale só para o broker rodando em localhost, durante o desenvolvimento.
# Na VM pública isto vira `false` — ver o bloco de produção abaixo.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ---------------------------------------------------------------------------
# Listener WebSocket (reserva para o 2º bimestre)
# ---------------------------------------------------------------------------
# listener 9001
# protocol websockets

# ---------------------------------------------------------------------------
# Broker na VM Oracle (INFRA-03) — configuração padrão do projeto
# ---------------------------------------------------------------------------
# Com a porta 1883 aberta para a internet, broker anônimo é broker aberto para
# o mundo inteiro. Na VM, troque as duas linhas acima por:
#
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
#
# Criando o arquivo de senhas:
#   mosquitto_passwd -c /mosquitto/config/passwd tankvitals
#
# O arquivo `passwd` está no .gitignore e NÃO vai para o repositório.
# As mesmas credenciais entram em MQTT_USERNAME/MQTT_PASSWORD no .env e em
# MQTT_USER/MQTT_PASS no sketch.ino.
#
# Lembre dos dois firewalls da Oracle (Security List da VCN + iptables da
# instância) e do registro DNS cinza no Cloudflare — detalhes na INFRA-03.

# ---------------------------------------------------------------------------
# Bridge com o broker público (INFRA-04) — plano B
# ---------------------------------------------------------------------------
# Só é usado se o broker da VM não estiver disponível. O ESP32 publica no
# test.mosquitto.org (que também é Mosquitto) e a bridge importa as mensagens
# para o broker local. Ver ARQUITETURA §7, Opção B.
#
# TODO(INFRA-04): trocar <SEU_PREFIXO> por um prefixo ÚNICO do grupo — o broker
# público é aberto, e com "tankvitals" genérico qualquer um publica lixo no seu
# tópico no meio da apresentação.
#
# connection wokwi-bridge
# address test.mosquitto.org:1883
# topic <SEU_PREFIXO>/# in 0
# bridge_protocol_version mqttv311
# cleansession true
# try_private false
# notifications false
