# TankVitals — configuração do Mosquitto
# Tarefas: INFRA-01 (listener) e INFRA-03 (bridge com o broker público)

# ---------------------------------------------------------------------------
# Listener local (INFRA-01)
# ---------------------------------------------------------------------------
# O Mosquitto 2.x NÃO aceita conexão vinda de fora do container sem declarar
# listener e allow_anonymous. Esquecer isso dá "Connection refused" em qualquer
# cliente, e o sintoma não diz o motivo.
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ---------------------------------------------------------------------------
# Listener WebSocket (reserva para o 2º bimestre)
# ---------------------------------------------------------------------------
# listener 9001
# protocol websockets

# ---------------------------------------------------------------------------
# Bridge com o broker público (INFRA-03)
# ---------------------------------------------------------------------------
# O ESP32 do Wokwi roda na nuvem e não enxerga este broker. Ele publica no
# test.mosquitto.org (que também é Mosquitto) e a bridge abaixo importa as
# mensagens para cá. Ver ARQUITETURA §7.
#
# TODO(INFRA-03): trocar <SEU_PREFIXO> por um prefixo ÚNICO do grupo — o broker
# público é aberto, e com "tankvitals" genérico qualquer um publica lixo no seu
# tópico no meio da apresentação. O mesmo prefixo vai no sketch.ino
# (TOPIC_PREFIX) e no .env (MQTT_TOPIC_PREFIX).
#
# connection wokwi-bridge
# address test.mosquitto.org:1883
# topic <SEU_PREFIXO>/# in 0
# bridge_protocol_version mqttv311
# cleansession true
# try_private false
# notifications false
