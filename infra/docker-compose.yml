# TankVitals — infraestrutura local (INFRA-01)
# Subir com:  docker compose up -d
# Contrato: docs/ARQUITETURA.md §4 e §8

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: tankvitals-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883" # MQTT
      - "9001:9001" # MQTT over WebSocket (reserva para o 2º bimestre)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    # A configuração fica em ./mosquitto/config/mosquitto.conf
    # A bridge com o broker público é a tarefa INFRA-03.

  influxdb:
    image: influxdb:2.7
    container_name: tankvitals-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      # TODO(INFRA-01): setup automático — assim o banco já sobe pronto e
      # ninguém precisa refazer o wizard quando recriar o container.
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: # TODO
      DOCKER_INFLUXDB_INIT_PASSWORD: # TODO (mínimo 8 caracteres)
      DOCKER_INFLUXDB_INIT_ORG: unifacef
      DOCKER_INFLUXDB_INIT_BUCKET: tankvitals
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: # TODO (token fixo de desenvolvimento)
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2

volumes:
  influxdb-data:
  influxdb-config:
