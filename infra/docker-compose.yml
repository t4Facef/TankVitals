# TankVitals: a pilha inteira do 2º bimestre. Suba pela raiz: `docker compose up`
# (o compose.yaml da raiz inclui este). Antes, gere os segredos: python scripts/gerar_segredos.py
services:
  ollama:
    image: ollama/ollama:0.11.4
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-init:
    image: tankvitals-app:local
    pull_policy: build
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.assistant.init_model"]
    restart: "no"
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    depends_on:
      ollama:
        condition: service_healthy

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    user: "1883:1883"
    ports:
      - "127.0.0.1:1883:1883"
    environment:
      MQTT_SIMULATOR_PASSWORD: ${MQTT_SIMULATOR_PASSWORD:?Run scripts/gerar_segredos.py first}
      MQTT_GATEWAY_PASSWORD: ${MQTT_GATEWAY_PASSWORD:?Run scripts/gerar_segredos.py first}
    entrypoint: ["/bin/sh", "/mosquitto/config/start-secure.sh"]
    volumes:
      - ./mosquitto/config/mosquitto-secure.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/start-secure.sh:/mosquitto/config/start-secure.sh:ro
      - ./mosquitto/config/acl:/mosquitto/config/acl:ro
      - mosquitto_data:/mosquitto/data
    tmpfs:
      - /run/mosquitto:rw,noexec,nosuid,size=1m,mode=0700,uid=1883,gid=1883
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -u simulator -P \"$$MQTT_SIMULATOR_PASSWORD\" -t tankvitals/healthcheck -m ok >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1.3-management
    restart: unless-stopped
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - ./rabbitmq/main.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - type: bind
        source: ${RABBITMQ_DEFINITIONS_FILE:-../secrets/definitions.json}
        target: /run/plat/definitions.json
        read_only: true
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:?Missing generated Influx username}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?Missing generated Influx password}
      DOCKER_INFLUXDB_INIT_ORG: unifacef
      DOCKER_INFLUXDB_INIT_BUCKET: tankvitals
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN:?Missing generated Influx admin token}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Missing generated Postgres database}
      POSTGRES_USER: ${POSTGRES_USER:?Missing generated Postgres user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing generated Postgres password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 20

  migrate:
    image: tankvitals-app:local
    pull_policy: build
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: "no"
    command: ["python", "-m", "app.migrate"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?Missing Postgres database}
      POSTGRES_USER: ${POSTGRES_USER:?Missing Postgres user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing Postgres password}
      DEMO_VIEWER_PASSWORD: ${DEMO_VIEWER_PASSWORD:?Missing viewer password}
      DEMO_OPERATOR_PASSWORD: ${DEMO_OPERATOR_PASSWORD:?Missing operator password}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Missing admin password}
    depends_on:
      postgres:
        condition: service_healthy
  token-bootstrap:
    image: tankvitals-app:local
    pull_policy: never
    user: "0:0"
    restart: "no"
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: unifacef
      INFLUX_BUCKET: tankvitals
      INFLUXDB_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN:?Missing generated Influx admin token}
      INFLUX_API_TOKEN_FILE: /run/plat/secrets/influx_api.token
    volumes:
      - influx_tokens:/run/plat
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        if [ ! -s /run/plat/secrets/influx_writer.token ]; then python /app/scripts/bootstrap_influx_writer.py --url http://influxdb:8086 --org unifacef --bucket tankvitals --root /run/plat; fi
        && if [ ! -s /run/plat/secrets/influx_api.token ]; then python /app/scripts/bootstrap_influx_api.py; fi
        && chown -R 10001:10001 /run/plat/secrets
        && chmod 0400 /run/plat/secrets/influx_writer.token /run/plat/secrets/influx_api.token
    depends_on:
      influxdb:
        condition: service_healthy

  api:
    image: tankvitals-app:local
    command: ["python", "-m", "app.api"]
    pull_policy: build
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USERNAME: ${MQTT_GATEWAY_USERNAME:?Missing MQTT username}
      MQTT_PASSWORD: ${MQTT_GATEWAY_PASSWORD:?Missing MQTT password}
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: unifacef
      INFLUX_BUCKET: tankvitals
      INFLUX_TOKEN_FILE: /run/plat/secrets/influx_api.token
      RABBITMQ_URL: amqp://${RABBITMQ_API_USERNAME:?Missing RabbitMQ API user}:${RABBITMQ_API_PASSWORD:?Missing RabbitMQ API password}@rabbitmq:5672/%2F
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_API_USERNAME: ${RABBITMQ_API_USERNAME:?Missing RabbitMQ API user}
      RABBITMQ_API_PASSWORD: ${RABBITMQ_API_PASSWORD:?Missing RabbitMQ API password}
      JWT_SECRET: ${JWT_SECRET_KEY:?Missing generated JWT secret}
      DEMO_VIEWER_PASSWORD: ${DEMO_VIEWER_PASSWORD:?Missing generated viewer password}
      DEMO_OPERATOR_PASSWORD: ${DEMO_OPERATOR_PASSWORD:?Missing generated operator password}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Missing generated admin password}
      AI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Missing Postgres user}:${POSTGRES_PASSWORD:?Missing Postgres password}@postgres:5432/${POSTGRES_DB:?Missing Postgres database}
      AI_DATA_DIR: /var/lib/tankvitals/ai
      MESSAGING_DB_PATH: /var/lib/tankvitals/messaging.sqlite
      CORS_ORIGINS: http://localhost:8080
      # Mesma velocidade do simulador: converte leituras em segundos no histórico.
      SIM_SPEED: ${SIM_SPEED:-60}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    volumes:
      - influx_tokens:/run/plat:ro
      - app_data:/var/lib/tankvitals
    depends_on:
      # Só o Ollama no ar, não o modelo baixado: se o download falhar (sem
      # internet, pouca memória), o resto do sistema sobe e a tela do
      # assistente mostra "carregando o modelo" até ele ficar pronto.
      ollama:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      token-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway:
    image: tankvitals-app:local
    pull_policy: never
    restart: unless-stopped
    command: ["python", "-m", "app.gateway"]
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USERNAME: ${MQTT_GATEWAY_USERNAME:?Missing MQTT gateway user}
      MQTT_PASSWORD: ${MQTT_GATEWAY_PASSWORD:?Missing MQTT gateway password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_GATEWAY_USERNAME:?Missing RabbitMQ gateway user}
      RABBITMQ_PASSWORD: ${RABBITMQ_GATEWAY_PASSWORD:?Missing RabbitMQ gateway password}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('mosquitto',1883),2).close(); socket.create_connection(('rabbitmq',5672),2).close()"]
      interval: 15s
      timeout: 5s
      retries: 5

  writer:
    image: tankvitals-app:local
    pull_policy: never
    restart: unless-stopped
    command: ["python", "-m", "app.writer"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_WRITER_USERNAME: ${RABBITMQ_WRITER_USERNAME:?Missing RabbitMQ Writer user}
      RABBITMQ_WRITER_PASSWORD: ${RABBITMQ_WRITER_PASSWORD:?Missing RabbitMQ Writer password}
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: unifacef
      INFLUX_BUCKET: tankvitals
      INFLUX_TOKEN_FILE: /run/plat/secrets/influx_writer.token
      WRITER_DEDUP_DB: /var/lib/tankvitals-writer/dedup.sqlite
    volumes:
      - influx_tokens:/run/plat:ro
      - writer_dedup:/var/lib/tankvitals-writer
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      token-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('rabbitmq',5672),2).close(); socket.create_connection(('influxdb',8086),2).close()"]
      interval: 15s
      timeout: 5s
      retries: 5

  rules:
    image: tankvitals-app:local
    pull_policy: never
    restart: unless-stopped
    command: ["python", "-m", "app.rules"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_RULES_USERNAME:?Missing RabbitMQ rules user}
      RABBITMQ_PASSWORD: ${RABBITMQ_RULES_PASSWORD:?Missing RabbitMQ rules password}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:?Missing Postgres user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing Postgres password}
      POSTGRES_DB: ${POSTGRES_DB:?Missing Postgres database}
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('rabbitmq',5672),2).close(); socket.create_connection(('postgres',5432),2).close()"]
      interval: 15s
      timeout: 5s
      retries: 5

  inference:
    image: tankvitals-app:local
    pull_policy: never
    restart: unless-stopped
    command: ["python", "-m", "app.inference"]
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_INFERENCE_USERNAME:?Missing RabbitMQ inference user}:${RABBITMQ_INFERENCE_PASSWORD:?Missing RabbitMQ inference password}@rabbitmq:5672/%2F
      AI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Missing Postgres user}:${POSTGRES_PASSWORD:?Missing Postgres password}@postgres:5432/${POSTGRES_DB:?Missing Postgres database}
      AI_DATA_DIR: /var/lib/tankvitals/ai
    volumes:
      - app_data:/var/lib/tankvitals
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('rabbitmq',5672),2).close(); socket.create_connection(('postgres',5432),2).close()"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    image: tankvitals-app:local
    pull_policy: never
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_WORKER_USERNAME:?Missing RabbitMQ worker user}:${RABBITMQ_WORKER_PASSWORD:?Missing RabbitMQ worker password}@rabbitmq:5672/%2F
      AI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Missing Postgres user}:${POSTGRES_PASSWORD:?Missing Postgres password}@postgres:5432/${POSTGRES_DB:?Missing Postgres database}
      AI_DATA_DIR: /var/lib/tankvitals/ai
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: unifacef
      INFLUX_BUCKET: tankvitals
      INFLUX_TOKEN_FILE: /run/plat/secrets/influx_api.token
    volumes:
      - influx_tokens:/run/plat:ro
      - app_data:/var/lib/tankvitals
    depends_on:
      rabbitmq:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('rabbitmq',5672),2).close(); socket.create_connection(('postgres',5432),2).close()"]
      interval: 15s
      timeout: 5s
      retries: 5

  simulator:
    image: tankvitals-app:local
    pull_policy: never
    restart: unless-stopped
    command: ["python", "-m", "app.simulator"]
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USERNAME: ${MQTT_SIMULATOR_USERNAME:?Missing MQTT simulator user}
      MQTT_PASSWORD: ${MQTT_SIMULATOR_PASSWORD:?Missing MQTT simulator password}
      SIM_SPEED: ${SIM_SPEED:-60}
    depends_on:
      migrate:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('mosquitto',1883),2).close()"]
      interval: 15s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Missing pgAdmin email}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Missing pgAdmin password}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['local']"
    volumes:
      # O PostgreSQL do compose já registrado; a senha é a POSTGRES_PASSWORD do .env.
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/misc/ping"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ../frontend
      args:
        VITE_MOCK: ${VITE_MOCK:-false}
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  ollama-models:
  mosquitto_data:
  rabbitmq_data:
  influxdb_data:
  influxdb_config:
  postgres_data:
  influx_tokens:
  app_data:
  writer_dedup:

