# TankVitals — o que roda na VM Oracle (INFRA-03): só o Mosquitto.
# InfluxDB, backend e frontend continuam na máquina local, porque todos fazem
# conexão de saída para o broker.
#
# Na VM:
#   docker compose -f docker-compose.vm.yml up -d
#
# Antes de subir, criar o arquivo de senhas (ver mosquitto.vm.conf) e copiar
# mosquitto.vm.conf para mosquitto/config/mosquitto.conf.

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: tankvitals-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
