# Faz o mesmo papel que o proxy do Vite em desenvolvimento (vite.config.ts):
# serve os estáticos e encaminha /api e /ws para o backend.

server {
    listen 8080;
    server_name _;

    # O IP de um container muda quando ele é recriado (um `up --build` só da
    # API, por exemplo). Com o nome numa variável, o Nginx consulta o DNS do
    # Docker de novo a cada 10 s, em vez de guardar o IP da subida e responder
    # 502 até ser reiniciado.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The assistant streams its response; buffering would hold chunks until
    # the upstream response closes instead of forwarding them as they arrive.
    location /api/assistant {
        proxy_pass $api_upstream;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Sem os cabeçalhos de Upgrade o Nginx trata o /ws/live como HTTP comum, a
    # conexão fecha na hora e o dashboard cai para o polling de 5 s.
    location /ws/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
